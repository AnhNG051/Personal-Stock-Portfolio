<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market — Personal Stock Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <a href="dashboard.html">Personal Stock Portfolio</a>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="market.html" class="active">Market</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="watchlist.html">Watchlist</a>
        <a href="change-password.html">Change Password</a>
        <a href="security-2fa.html">Security</a>
      </nav>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="session-pill"><span class="dot"></span>Encrypted session</div>
        <button class="btn btn-secondary btn-small" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <main class="main">
      <div class="section-heading">
        <h2>Market board</h2>
        <div style="display:flex;align-items:center;gap:14px;">
          <span id="lastUpdatedLabel" style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);"></span>
          <button class="btn btn-secondary btn-small" id="refreshBtn">Refresh now</button>
        </div>
      </div>

      <div class="form-error" id="pageErrorBox" style="display:none;"></div>

      <div class="panel" id="marketPanel">
        <div class="empty-state">Loading…</div>
      </div>

      <div class="section-heading"><h2>Search the market</h2></div>
      <div class="panel panel-padded" style="position:relative;">
        <input id="searchInput" placeholder="Search any NASDAQ/NYSE stock by ticker or company name" style="width:100%;max-width:420px;background:var(--bg);border:1px solid var(--border-bright);border-radius:6px;padding:8px 10px;color:var(--text-primary);font-family:var(--font-mono);font-size:13px;" autocomplete="off" />
        <div id="searchResults" style="display:none;max-width:420px;background:var(--bg-panel-raised);border:1px solid var(--border-bright);border-radius:6px;margin-top:6px;max-height:260px;overflow-y:auto;"></div>
        <p id="searchStatus" style="font-size:12px;color:var(--text-muted);margin-bottom:0;margin-top:10px;"></p>
      </div>
    </main>

    <div class="footer-credit">Personal Stock Portfolio — © 2026 Anh Quang Nguyen. All rights reserved.</div>
  </div>

  <script>
    var API_BASE = "http://localhost:4000/api";
    var REFRESH_INTERVAL_MS = 20000; // 20 seconds — genuinely "live" without hammering the API

    function getAccessToken() { return localStorage.getItem("psp_access_token"); }
    function getRefreshToken() { return localStorage.getItem("psp_refresh_token"); }
    function setTokens(accessToken, refreshToken) {
      if (accessToken) localStorage.setItem("psp_access_token", accessToken);
      if (refreshToken) localStorage.setItem("psp_refresh_token", refreshToken);
    }
    function clearTokens() {
      localStorage.removeItem("psp_access_token");
      localStorage.removeItem("psp_refresh_token");
    }

    if (!getAccessToken()) {
      window.location.href = "login.html";
    }

    function apiRequest(path, options) {
      options = options || {};
      var headers = { "Content-Type": "application/json" };
      headers["Authorization"] = "Bearer " + getAccessToken();

      return fetch(API_BASE + path, {
        method: options.method || "GET",
        headers: headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      }).then(function (response) {
        if (response.status === 401 && options.retry !== false) {
          return tryRefreshToken().then(function (refreshed) {
            if (refreshed) {
              return apiRequest(path, Object.assign({}, options, { retry: false }));
            }
            return response.json().then(function (data) {
              throw new Error(data.error || "Session expired. Please sign in again.");
            });
          });
        }
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (!response.ok) throw new Error(data.error || "Request failed (" + response.status + ")");
          return data;
        });
      });
    }

    var refreshPromise = null;

    function tryRefreshToken() {
      if (refreshPromise) return refreshPromise;

      var refreshToken = getRefreshToken();
      if (!refreshToken) return Promise.resolve(false);

      refreshPromise = fetch(API_BASE + "/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refreshToken: refreshToken }),
      })
        .then(function (response) {
          if (!response.ok) return false;
          return response.json().then(function (data) {
            setTokens(data.accessToken, data.refreshToken);
            return true;
          });
        })
        .catch(function () { return false; })
        .finally(function () { refreshPromise = null; });

      return refreshPromise;
    }

    document.getElementById("signOutBtn").addEventListener("click", function () {
      var refreshToken = getRefreshToken();
      apiRequest("/auth/logout", { method: "POST", body: { refreshToken: refreshToken } })
        .catch(function () {})
        .finally(function () {
          clearTokens();
          window.location.href = "login.html";
        });
    });

    // --- Board state ------------------------------------------------------------
    // A starting set of well-known, actively-traded tickers. This list is
    // just this browser session's view of the board — it lives in a plain
    // JS array, not the database. Use the Watchlist page to permanently
    // follow a stock.
    var boardTickers = ["NVDA", "INTC", "QBTS", "NOK", "AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "META"];

    var marketPanel = document.getElementById("marketPanel");
    var pageErrorBox = document.getElementById("pageErrorBox");
    var lastUpdatedLabel = document.getElementById("lastUpdatedLabel");
    var refreshTimer = null;

    function formatChange(quote) {
      if (!quote || quote.error) {
        return { priceText: "—", changeText: "unavailable", cssClass: "price-flat" };
      }
      var cssClass = "price-flat";
      if (quote.change > 0) cssClass = "price-up";
      else if (quote.change < 0) cssClass = "price-down";

      var sign = quote.change > 0 ? "+" : "";
      var changeText = sign + quote.change.toFixed(2) + " (" + sign + quote.percentChange.toFixed(2) + "%)";
      return { priceText: "$" + quote.currentPrice.toFixed(2), changeText: changeText, cssClass: cssClass };
    }

    function renderBoard(rows) {
      var rowsHtml = "";
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var display = formatChange(row.quote);
        rowsHtml +=
          "<tr>" +
          '<td><a class="ticker" href="stock.html?symbol=' + row.ticker + '">' + row.ticker + "</a></td>" +
          "<td>" + display.priceText + "</td>" +
          '<td class="' + display.cssClass + '">' + display.changeText + "</td>" +
          '<td><button class="remove-btn" data-ticker="' + row.ticker + '">Remove from board</button></td>' +
          "</tr>";
      }

      marketPanel.innerHTML =
        "<table>" +
        "<thead><tr><th>Ticker</th><th>Price</th><th>Daily change</th><th></th></tr></thead>" +
        "<tbody>" + rowsHtml + "</tbody>" +
        "</table>";

      var removeButtons = marketPanel.querySelectorAll(".remove-btn");
      for (var j = 0; j < removeButtons.length; j++) {
        removeButtons[j].addEventListener("click", function (event) {
          var ticker = event.target.getAttribute("data-ticker");
          boardTickers = boardTickers.filter(function (t) { return t !== ticker; });
          loadBoard();
        });
      }
    }

    function loadBoard() {
      pageErrorBox.style.display = "none";

      if (boardTickers.length === 0) {
        marketPanel.innerHTML = '<div class="empty-state">The board is empty. Add a ticker below.</div>';
        return Promise.resolve();
      }

      var quotePromises = boardTickers.map(function (ticker) {
        return apiRequest("/stocks/quote/" + ticker)
          .then(function (quote) { return quote; })
          .catch(function (error) { return { error: error.message }; });
      });

      return Promise.all(quotePromises).then(function (quotes) {
        var rows = boardTickers.map(function (ticker, index) {
          return { ticker: ticker, quote: quotes[index] };
        });
        renderBoard(rows);
        lastUpdatedLabel.textContent = "Updated " + new Date().toLocaleTimeString();
      });
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function () {
        loadBoard().catch(function (error) {
          pageErrorBox.textContent = error.message;
          pageErrorBox.style.display = "block";
        });
      }, REFRESH_INTERVAL_MS);
    }

    // Pause polling when the tab isn't visible, resume when it is —
    // avoids burning API quota on a background tab.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        if (refreshTimer) clearInterval(refreshTimer);
      } else {
        loadBoard();
        startAutoRefresh();
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", function () {
      loadBoard().catch(function (error) {
        pageErrorBox.textContent = error.message;
        pageErrorBox.style.display = "block";
      });
    });

    var allSymbols = [];
    var searchStatus = document.getElementById("searchStatus");
    var searchInput = document.getElementById("searchInput");
    var searchResults = document.getElementById("searchResults");

    apiRequest("/stocks/symbols")
      .then(function (symbols) {
        allSymbols = symbols;
        searchStatus.textContent = allSymbols.length + " NASDAQ/NYSE tickers loaded — search above to add any of them.";
      })
      .catch(function (error) {
        searchStatus.textContent = "Search unavailable: " + error.message;
      });

    searchInput.addEventListener("input", function () {
      var query = searchInput.value.trim().toUpperCase();
      if (query.length < 1) {
        searchResults.style.display = "none";
        return;
      }

      var matches = allSymbols
        .filter(function (s) {
          return s.symbol.indexOf(query) === 0 || s.name.toUpperCase().indexOf(query) !== -1;
        })
        .slice(0, 15);

      if (matches.length === 0) {
        searchResults.style.display = "none";
        return;
      }

      var html = "";
      for (var i = 0; i < matches.length; i++) {
        html +=
          '<div class="remove-btn" data-symbol="' + matches[i].symbol + '" ' +
          'style="border:none;border-radius:0;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;">' +
          '<span class="ticker">' + matches[i].symbol + "</span>" +
          '<span style="color:var(--text-muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + matches[i].name + "</span>" +
          "</div>";
      }
      searchResults.innerHTML = html;
      searchResults.style.display = "block";

      var resultRows = searchResults.querySelectorAll("[data-symbol]");
      for (var j = 0; j < resultRows.length; j++) {
        resultRows[j].addEventListener("click", function (event) {
          var symbol = event.currentTarget.getAttribute("data-symbol");
          if (boardTickers.indexOf(symbol) === -1) {
            boardTickers.push(symbol);
            loadBoard();
          }
          searchInput.value = "";
          searchResults.style.display = "none";
        });
      }
    });

    document.addEventListener("click", function (event) {
      if (!searchResults.contains(event.target) && event.target !== searchInput) {
        searchResults.style.display = "none";
      }
    });

    // --- Initial load + start polling --------------------------------------------
    loadBoard()
      .then(function () { startAutoRefresh(); })
      .catch(function (error) {
        pageErrorBox.textContent = error.message;
        pageErrorBox.style.display = "block";
      });
  </script>
</body>
</html>
