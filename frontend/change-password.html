<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — Personal Stock Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <a href="dashboard.html">Personal Stock Portfolio</a>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="market.html">Market</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="watchlist.html">Watchlist</a>
        <a href="change-password.html" class="active">Change Password</a>
        <a href="security-2fa.html">Security</a>
      </nav>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="session-pill"><span class="dot"></span>Encrypted session</div>
        <button class="btn btn-secondary btn-small" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <main class="main">
      <div class="section-heading"><h2>Change password</h2></div>

      <div class="panel panel-padded">
        <div class="form-error" id="errorBox" style="display:none;"></div>
        <div class="form-success" id="successBox" style="display:none;"></div>

        <form id="changeForm" style="max-width:320px;">
          <div class="field">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" type="password" autocomplete="current-password" required />
          </div>
          <div class="field">
            <label for="newPassword">New password (min 10 characters)</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="10" required />
          </div>
          <button class="btn btn-primary" type="submit" id="submitBtn" style="max-width:240px;">Change password</button>
        </form>
      </div>
    </main>

    <div class="footer-credit">Personal Stock Portfolio — © 2026 Anh Quang Nguyen. All rights reserved.</div>
  </div>

  <script>
    var API_BASE = "http://localhost:4000/api";

    // --- Token helpers -----------------------------------------------------
    function getAccessToken() { return localStorage.getItem("psp_access_token"); }
    function getRefreshToken() { return localStorage.getItem("psp_refresh_token"); }
    function setTokens(accessToken, refreshToken) {
      if (accessToken) localStorage.setItem("psp_access_token", accessToken);
      if (refreshToken) localStorage.setItem("psp_refresh_token", refreshToken);
    }
    function clearTokens() {
      localStorage.removeItem("psp_access_token");
      localStorage.removeItem("psp_refresh_token");
    }

    // This page requires an active session.
    if (!getAccessToken()) {
      window.location.href = "login.html";
    }

    // --- Authenticated request helper with automatic token refresh ----------
    function apiRequest(path, options) {
      options = options || {};
      var headers = { "Content-Type": "application/json" };
      headers["Authorization"] = "Bearer " + getAccessToken();

      return fetch(API_BASE + path, {
        method: options.method || "GET",
        headers: headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      }).then(function (response) {
        if (response.status === 401 && options.retry !== false) {
          return tryRefreshToken().then(function (refreshed) {
            if (refreshed) {
              return apiRequest(path, Object.assign({}, options, { retry: false }));
            }
            return response.json().then(function (data) {
              throw new Error(data.error || "Session expired. Please sign in again.");
            });
          });
        }
        return response.json().catch(function () { return {}; }).then(function (data) {
          if (!response.ok) throw new Error(data.error || "Request failed (" + response.status + ")");
          return data;
        });
      });
    }

    var refreshPromise = null;

    function tryRefreshToken() {
      if (refreshPromise) return refreshPromise;

      var refreshToken = getRefreshToken();
      if (!refreshToken) return Promise.resolve(false);

      refreshPromise = fetch(API_BASE + "/auth/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refreshToken: refreshToken }),
      })
        .then(function (response) {
          if (!response.ok) return false;
          return response.json().then(function (data) {
            setTokens(data.accessToken, data.refreshToken);
            return true;
          });
        })
        .catch(function () { return false; })
        .finally(function () { refreshPromise = null; });

      return refreshPromise;
    }

    // --- Sign out -----------------------------------------------------------
    document.getElementById("signOutBtn").addEventListener("click", function () {
      var refreshToken = getRefreshToken();
      apiRequest("/auth/logout", { method: "POST", body: { refreshToken: refreshToken } })
        .catch(function () { /* proceed with local logout regardless */ })
        .finally(function () {
          clearTokens();
          window.location.href = "login.html";
        });
    });

    // --- Change password form ------------------------------------------------
    var errorBox = document.getElementById("errorBox");
    var successBox = document.getElementById("successBox");
    var changeForm = document.getElementById("changeForm");
    var submitBtn = document.getElementById("submitBtn");

    changeForm.addEventListener("submit", function (event) {
      event.preventDefault();
      errorBox.style.display = "none";
      successBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Changing…";

      var currentPassword = document.getElementById("currentPassword").value;
      var newPassword = document.getElementById("newPassword").value;

      apiRequest("/auth/change-password", {
        method: "POST",
        body: { currentPassword: currentPassword, newPassword: newPassword },
      })
        .then(function () {
          successBox.textContent = "Password changed. Redirecting to sign in…";
          successBox.style.display = "block";
          changeForm.style.display = "none";

          // The backend revokes all sessions on password change, so the
          // current tokens are already invalid — clear them locally too.
          setTimeout(function () {
            clearTokens();
            window.location.href = "login.html";
          }, 1800);
        })
        .catch(function (error) {
          errorBox.textContent = error.message;
          errorBox.style.display = "block";
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Change password";
        });
    });
  </script>
</body>
</html>
