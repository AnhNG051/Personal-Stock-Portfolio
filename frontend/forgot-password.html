<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Personal Stock Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Forgot password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div class="form-error" id="errorBox" style="display:none;"></div>
      <div class="form-success" id="successBox" style="display:none;"></div>
      <div id="devLinkBox" style="display:none;margin-top:12px;"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>

  <script>
    var API_BASE = "http://localhost:4000/api";

    var errorBox = document.getElementById("errorBox");
    var successBox = document.getElementById("successBox");
    var devLinkBox = document.getElementById("devLinkBox");
    var forgotForm = document.getElementById("forgotForm");
    var submitBtn = document.getElementById("submitBtn");

    forgotForm.addEventListener("submit", function (event) {
      event.preventDefault();
      errorBox.style.display = "none";
      successBox.style.display = "none";
      devLinkBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending…";

      var email = document.getElementById("email").value;

      fetch(API_BASE + "/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email }),
      })
        .then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(data.error || "Something went wrong.");
            return data;
          });
        })
        .then(function (data) {
          successBox.textContent = data.message;
          successBox.style.display = "block";

          if (data.devResetLink) {
            devLinkBox.innerHTML =
              '<p style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">' +
              "No email service is configured in this dev environment — here's the link directly:</p>" +
              '<a href="' + data.devResetLink + '" class="mono-key" style="display:block;text-decoration:none;">' +
              data.devResetLink +
              "</a>";
            devLinkBox.style.display = "block";
          }
        })
        .catch(function (error) {
          errorBox.textContent = error.message;
          errorBox.style.display = "block";
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send reset link";
        });
    });
  </script>
</body>
</html>
