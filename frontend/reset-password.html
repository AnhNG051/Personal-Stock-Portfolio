<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Personal Stock Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset password</h1>
      <p class="auth-subtitle" id="subtitle">Choose a new password for your account.</p>

      <div class="form-error" id="errorBox" style="display:none;"></div>
      <div class="form-success" id="successBox" style="display:none;"></div>

      <form id="resetForm">
        <div class="field">
          <label for="password">New password (min 10 characters)</label>
          <input id="password" type="password" autocomplete="new-password" minlength="10" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Reset password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>

  <script>
    var API_BASE = "http://localhost:4000/api";

    // The reset link looks like: reset-password.html?token=abc123
    function getTokenFromUrl() {
      var params = new URLSearchParams(window.location.search);
      return params.get("token");
    }

    var token = getTokenFromUrl();
    var errorBox = document.getElementById("errorBox");
    var successBox = document.getElementById("successBox");
    var resetForm = document.getElementById("resetForm");
    var submitBtn = document.getElementById("submitBtn");

    if (!token) {
      resetForm.style.display = "none";
      errorBox.textContent =
        "This reset link is missing its token. Please use the link from your email, or request a new one.";
      errorBox.style.display = "block";
    }

    resetForm.addEventListener("submit", function (event) {
      event.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Resetting…";

      var newPassword = document.getElementById("password").value;

      fetch(API_BASE + "/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, newPassword: newPassword }),
      })
        .then(function (response) {
          return response.json().then(function (data) {
            if (!response.ok) throw new Error(data.error || "Something went wrong.");
            return data;
          });
        })
        .then(function (data) {
          successBox.textContent = data.message;
          successBox.style.display = "block";
          resetForm.style.display = "none";
        })
        .catch(function (error) {
          errorBox.textContent = error.message;
          errorBox.style.display = "block";
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Reset password";
        });
    });
  </script>
</body>
</html>
